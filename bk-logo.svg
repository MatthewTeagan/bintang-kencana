<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 100" role="img" aria-labelledby="title">
  <title id="title">BK Bintang Kencana Industrial Roller Chain</title>

  <!-- Gear -->
  <g transform="translate(50 50)" fill="#2b63ae">
    <circle r="39.5" fill="none" stroke="#2b63ae" stroke-width="7"/>
    <g id="tooth">
      <polygon points="-11,-40 -7.5,-50 7.5,-50 11,-40"/>
    </g>
    <use href="#tooth" transform="rotate(45)"/>
    <use href="#tooth" transform="rotate(90)"/>
    <use href="#tooth" transform="rotate(135)"/>
    <use href="#tooth" transform="rotate(180)"/>
    <use href="#tooth" transform="rotate(225)"/>
    <use href="#tooth" transform="rotate(270)"/>
    <use href="#tooth" transform="rotate(315)"/>
  </g>

  <!-- B -->
  <path fill="#1a1a1a" fill-rule="evenodd"
        d="M27 29H45C52 29 56 32.5 56 38C56 41.5 54 44 51 45.2C55 46.2 58 49 58 54C58 59.5 53.500 62.500 46 62.500H27Z
           M33.500 34.500V42H44C48 42 50 40.500 50 38.200C50 36 48 34.500 44 34.500Z
           M33.500 47V57H45.500C50 57 52 55 52 52C52 49 50 47 45.500 47Z"/>

  <!-- K (chevron) -->
  <path d="M77 31L61 46.500L78 62" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linejoin="miter"/>

  <!-- Text -->
  <g fill="#1a1a1a" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25">
    <text x="111" y="42.500" textLength="132" lengthAdjust="spacingAndGlyphs">BINTANG</text>
    <text x="111" y="66.500" textLength="139" lengthAdjust="spacingAndGlyphs">KENCANA</text>
  </g>
  <text x="112" y="83" font-family="Arial, Helvetica, sans-serif" font-size="10.500" fill="#1a1a1a"
        textLength="138" lengthAdjust="spacing">Industrial Roller Chain</text>
</svg>